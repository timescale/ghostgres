app = "ghostgres"
primary_region = "iad"

[build]

# Persists ACME certificates and account key across restarts. Each machine has
# its own volume (and therefore its own certificate).
[mounts]
  source = "ghostgres_data"
  destination = "/data"

[experimental]
  entrypoint = ["./ghostgres", "-acme-domain", "try.ghostgres.com", "-acme-cache-dir", "/data/acme", "-acme-tls-addr", ":8443", "-acme-email", "nathan@tigerdata.com"]

[[services]]
  protocol = "tcp"
  internal_port = 5432
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 5432

# ACME TLS-ALPN-01 challenges. Raw TCP passthrough so the server, not Fly's
# proxy, terminates TLS.
[[services]]
  protocol = "tcp"
  internal_port = 8443
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 443
