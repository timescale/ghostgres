app = "ghostgres"
primary_region = "iad"

[build]

# Persists ACME certificates and account key across restarts. Each machine has
# its own volume (and therefore its own certificate).
[mounts]
  source = "ghostgres_data"
  destination = "/data"

[experimental]
  entrypoint = ["./ghostgres", "-acme-domain", "try.ghostgres.com", "-acme-cache-dir", "/data/acme", "-acme-http-addr", ":8080", "-acme-email", "nathan@tigerdata.com"]

[[services]]
  protocol = "tcp"
  internal_port = 5432
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 5432

# ACME HTTP-01 challenges. Raw TCP passthrough so Fly's proxy doesn't intercept
# /.well-known/acme-challenge requests.
[[services]]
  protocol = "tcp"
  internal_port = 8080
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
